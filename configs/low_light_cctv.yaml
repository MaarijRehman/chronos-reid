# Preset: Low-Light & Nighttime Fixed CCTV Footage
video:
  mode: "sampled"
  sample_fps: 5.0
  camera_mode: "fixed"
  motion_compensation: false
  adaptive_sampling: true
  motion_pixel_threshold: 14.0

detector:
  model_path: "yolo11n.pt"
  imgsz: 640
  conf_threshold: 0.30
  candidate_conf_threshold: 0.18
  person_class_id: 0
  device: "auto"
  edge_margin_px: 12

tracker:
  type: "botsort"
  track_high_thresh: 0.32
  track_low_thresh: 0.12
  new_track_thresh: 0.42
  track_buffer: 60
  match_thresh: 0.75
  proximity_thresh: 0.55
  appearance_thresh: 0.28
  with_reid: true

reid:
  backbone: "osnet_x1_0"
  weights_path: ""
  similarity_threshold: 0.62
  ambiguous_margin: 0.05
  uncertain_lower_bound: 0.48
  max_embeddings_per_identity: 12
  max_crops_per_identity: 5
  min_embedding_interval_sec: 0.80

confirmation:
  min_observations: 2
  window_frames: 4
  max_confirmation_window_sec: 8.0
  candidate_timeout_sec: 5.0
  single_obs_exception: true
  single_obs_min_conf: 0.75
  single_obs_min_quality: 0.50
  min_crop_width: 28
  min_crop_height: 56
  crop_quality_threshold: 0.25
  nms_iou_threshold: 0.65
  containment_threshold: 0.80

events:
  return_absence_threshold_sec: 60.0
  enable_return_events: true
  grouping_window_sec: 1.0
  max_selection_delay_sec: 1.5
  frame_buffer_size: 25

quality:
  blur_laplacian_ref: 60.0
  weight_conf: 0.40
  weight_sharpness: 0.15
  weight_size: 0.20
  weight_boundary: 0.15
  weight_occlusion: 0.10

output:
  base_dir: "output"
  image_format: "jpg"
  jpeg_quality: 92
  save_person_crops: true
  save_annotated_debug: false
  save_debug_video: false
